plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'app.zhilibyli'
    compileSdk 34

    defaultConfig {
        applicationId 'app.zhilibyli'
        minSdk 26
        targetSdk 34
        versionCode 15
        versionName '3.3'

        buildConfigField 'String', 'UPDATE_MANIFEST_URL', '"https://zhilibyli.online/app-version.json"'
    }

    signingConfigs {
        release {
            def keystoreFile = file('/opt/android/zhilibyli.keystore')
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword 'zhilibyli2026'
                keyAlias 'zhilibyli'
                keyPassword 'zhilibyli2026'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Без keystore собираем unsigned APK: веб-деплой от этого не зависит.
            if (file('/opt/android/zhilibyli.keystore').exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    lint {
        // Локальная сборка релиза: runtime-линты не блокируют.
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'io.coil-kt:coil:2.7.0'

    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-session:1.4.1'
    implementation 'androidx.media3:media3-common:1.4.1'
}
