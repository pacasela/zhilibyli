name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'apk (installable file) or aab (Play Store bundle)'
        type: choice
        options:
          - apk
          - aab
        default: apk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Sync native Android project
        run: npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ensure gradlew is executable
        run: chmod +x android/gradlew

      - name: Build release APK
        if: inputs.build_type == 'apk'
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        if: inputs.build_type == 'apk'
        uses: actions/upload-artifact@v4
        with:
          name: zhilibyli-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Build release AAB (Play Store)
        if: inputs.build_type == 'aab'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "No release keystore secret — building unsigned AAB."
            cd android
            ./gradlew bundleRelease --no-daemon
          else
            mkdir -p "$RUNNER_TEMP/keystore"
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/release.keystore"
            export RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/keystore/release.keystore"
            cd android
            ./gradlew bundleRelease --no-daemon
          fi

      - name: Upload AAB artifact
        if: inputs.build_type == 'aab'
        uses: actions/upload-artifact@v4
        with:
          name: zhilibyli-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
