name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'apk (installable file) or aab (Play Store bundle)'
        type: choice
        options:
          - apk
          - aab
        default: apk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build web app and sync native Android project
        run: |
          npm run build
          npx cap sync android
          printf '%s\n' \
            '' \
            'android {' \
            '    buildTypes {' \
            '        release {' \
            '            signingConfig signingConfigs.debug' \
            '        }' \
            '    }' \
            '}' >> android/app/build.gradle

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Enforce Android target/compile SDK 36
        run: |
          for f in android/build.gradle android/variables.gradle; do
            if [ -f "$f" ]; then
              sed -i -E 's/(compileSdkVersion[[:space:]]*=[[:space:]]*)[0-9]+/\136/' "$f"
              sed -i -E 's/(targetSdkVersion[[:space:]]*=[[:space:]]*)[0-9]+/\136/' "$f"
            fi
          done

      - name: Ensure gradlew is executable
        run: chmod +x android/gradlew

      - name: Bump Gradle JVM memory and disable release lint
        run: |
          echo "" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=2g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties
          printf '%s\n' '' 'android {' '    lint {' '        checkReleaseBuilds false' '        abortOnError false' '    }' '}' >> android/app/build.gradle

      - name: Build release APK
        if: ${{ inputs.build_type != 'aab' }}
        run: |
          cd android
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a -Pandroid.enableProguardInReleaseBuilds=true -x lintVitalAnalyzeRelease

      - name: Upload APK artifact
        if: ${{ inputs.build_type != 'aab' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Build release AAB (Play Store)
        if: ${{ inputs.build_type == 'aab' }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "No release keystore secret yet — generating one for first-time setup."
            mkdir -p keystore-bootstrap
            STOREPASS=$(openssl rand -hex 16)
            keytool -genkeypair -v -keystore keystore-bootstrap/release.keystore -alias upload \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STOREPASS" -keypass "$STOREPASS" \
              -dname "CN=PolyDev,OU=PolyDev,O=PolyDev,L=Unknown,S=Unknown,C=US"
            base64 -w0 keystore-bootstrap/release.keystore > keystore-bootstrap/RELEASE_KEYSTORE_BASE64.txt
            printf '%s' "$STOREPASS" > keystore-bootstrap/RELEASE_KEYSTORE_PASSWORD.txt
            printf '%s' "upload" > keystore-bootstrap/RELEASE_KEY_ALIAS.txt
            echo "NEEDS_KEYSTORE_SETUP=true" >> "$GITHUB_ENV"
          else
            mkdir -p "$RUNNER_TEMP/keystore"
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/release.keystore"
            printf '%s\n' \
              '' \
              'android {' \
              '    signingConfigs {' \
              '        release {' \
              '            storeFile file(System.getenv("RELEASE_KEYSTORE_PATH"))' \
              '            storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD")' \
              '            keyAlias System.getenv("RELEASE_KEY_ALIAS")' \
              '            keyPassword System.getenv("RELEASE_KEYSTORE_PASSWORD")' \
              '        }' \
              '    }' \
              '    buildTypes {' \
              '        release {' \
              '            signingConfig signingConfigs.release' \
              '        }' \
              '    }' \
              '}' >> android/app/build.gradle
            export RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/keystore/release.keystore"
            cd android
            ./gradlew bundleRelease -PreactNativeArchitectures=arm64-v8a -Pandroid.enableProguardInReleaseBuilds=true -x lintVitalAnalyzeRelease
          fi

      - name: Upload signing key for one-time GitHub Secrets setup
        if: ${{ inputs.build_type == 'aab' && env.NEEDS_KEYSTORE_SETUP == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore-bootstrap
          path: keystore-bootstrap/*

      - name: Upload AAB artifact
        if: ${{ inputs.build_type == 'aab' && env.NEEDS_KEYSTORE_SETUP != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
